        - heading "About Us" [level=3] [ref=e72]
        - paragraph [ref=e73]: Joseph Fellowship (約瑟團契) is a Cantonese-speaking adult fellowship for believers and families — many with roots in Hong Kong. Named after the biblical Joseph who faithfully served God through every season of life, our fellowship brings people together to support one another in faith, family life, and daily challenges.
