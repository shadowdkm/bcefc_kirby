  - main [ref=e62]:
    - generic [ref=e66]:
      - heading "Caring Ministry" [level=1] [ref=e67]
      - paragraph [ref=e68]: No One Walks Alone · 關顧部
    - article [ref=e69]:
      - generic [ref=e71]:
        - paragraph [ref=e72]: The Caring Ministry ensures that no member of our church family walks alone through life's seasons. We stay connected, provide practical support, and extend the love of Christ to every person — from newcomers to long-time members.
        - heading "Pastoral Care" [level=3] [ref=e73]
        - paragraph [ref=e74]: Regular contact through phone, email and WhatsApp to stay connected with all members. Comfort cards and visits for those who are sick or going through difficult times.
        - heading "People Help People" [level=3] [ref=e75]
        - paragraph [ref=e76]: A practical support initiative where members help one another with meal preparation, transportation, and everyday needs.
        - heading "Senior Care" [level=3] [ref=e77]
        - paragraph [ref=e78]: Dedicated phone calls and home visits for our senior members, ensuring they feel seen, valued and loved.
        - heading "Welcoming Ministry" [level=3] [ref=e79]
        - paragraph [ref=e80]: Our Sunday worship welcoming team greets everyone with warmth at the door.
        - heading "Newcomer Care" [level=3] [ref=e81]
        - paragraph [ref=e82]: "Follow-up within one week of a first visit: personal introductions, activity invitations, and a small welcome gift."
        - paragraph [ref=e83]: "Director: Josephine"
    - generic [ref=e86]:
