  - main [ref=e62]:
    - generic [ref=e66]:
      - heading "Pastoral Staff" [level=2] [ref=e67]
      - paragraph [ref=e68]: 牧者與同工
    - article [ref=e69]:
      - paragraph [ref=e72]: Our pastoral staff team is dedicated to serving God and the church, leading brothers and sisters to grow in faith, and building the body of Christ.
    - generic [ref=e74]:
      - heading "Our Pastors" [level=2] [ref=e75]
      - generic [ref=e76]:
        - article [ref=e77]:
          - img "Rev. Sam Lam - Lead Pastor" [ref=e78]
          - heading "Rev. Sam Lam" [level=3] [ref=e79]
          - paragraph [ref=e80]: Lead Pastor & Chinese Ministry Pastor
          - paragraph [ref=e81]: Rev. Sam Lam was born in Hong Kong and came to faith in 1998. He was baptized in 2000 and joined the Evangelical Free Church of China Grace Spring Church in Hong Kong. In 2005, he answered God's call to enter Evangel Seminary, earning his Bachelor of Theology in 2009 and Master of Divinity in 2011. After graduation, he returned to serve at his home church. Rev. Lam joined Burnaby Chinese Evangelical Free Church in April 2016. He is married with one son currently in secondary school. His wife, Pastor Lai Hing-ying, obtained her Master of Divinity from Evangel Seminary in 2008 and now serves as a volunteer pastor assisting with Mandarin ministry development.
        - article [ref=e82]:
          - img "Pastor Grace Chang - Children's Ministry Pastor" [ref=e83]
          - heading "Pastor Grace Chang" [level=3] [ref=e84]
          - paragraph [ref=e85]: Children's Ministry Pastor
          - paragraph [ref=e86]: Pastor Grace Chang was born into a Christian family. She came to faith in elementary school and responded to God's call during her teenage years, dedicating her life to Kingdom work. Pastor Chang taught in Hong Kong before immigrating to Canada in 1988. She completed her Christian Education degree from Prairie Bible College in 1994 and pursued further studies at the Child Evangelism Fellowship's Children's Education Institute in the USA. Pastor Chang has a special love for children and serves as their mentor, leader, and friend. She joined the BCEFC family in June 2013.
        - article [ref=e87]:
          - img "Pastor Jean Lam - Youth Ministry Pastor" [ref=e88]
          - heading "Pastor Jean Lam" [level=3] [ref=e89]
          - paragraph [ref=e90]: Youth Ministry Pastor
          - paragraph [ref=e91]: Pastor Jean Lam was born in Hong Kong and came to faith in 2004. Answering God's call, she came to the Canadian Chinese School of Theology Vancouver in 2023 to pursue her Master of Theological Studies, graduating in 2025 before joining Burnaby Chinese Evangelical Free Church. Pastor Lam primarily serves in youth and family-related ministries, focusing on nurturing teenagers and their inner growth. She hopes to accompany them through this crucial stage of faith and life formation through biblical truth and life testimony, helping them establish a firm and healthy foundation in Christ. Pastor Lam is married to Benny, has a daughter Vivian, and lives in Richmond with their dog Kobe.
