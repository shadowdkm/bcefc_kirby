title: Pastor Update
num: date
icon: ✍️

status:
  draft:
    label: Draft
    text: Only visible to panel editors.
  listed:
    label: Published
    text: Live on the site.

columns:
  - width: 2/3
    fields:
      summary:
        label: Opening / 開場摘要
        type: writer
        help: Brief intro shown on the listing page (1–3 sentences).
        marks:
          - bold
          - italic
      text:
        label: Full Content / 完整內容
        type: blocks

  - width: 1/3
    sections:
      meta:
        type: fields
        fields:
          date:
            label: Date / 日期
            type: date
            default: now
            required: true
          author:
            label: Author / 作者
            type: text
            placeholder: "Pastor John"
          scripture:
            label: Scripture Reference / 金句
            type: text
            placeholder: "John 15:1–8"
          cover:
            label: Cover Image / 封面圖片
            extends: fields/cover
      files:
        type: files
        template: image
