title: Church Calendar
icon: 📅

columns:
  main:
    width: 2/3
    sections:
      content:
        type: fields
        fields:
          google_embed_url:
            label: Google Calendar Embed URL
            type: text
            placeholder: "https://calendar.google.com/calendar/embed?src=..."
            help: |
              在 Google Calendar 桌面版：設定 (⚙) → 選擇行事曆 → 整合行事曆 → 複製「公開網址」貼到這裡。
              記得先將行事曆設定為「公開」，否則訪客看不到。

  sidebar:
    width: 1/3
    sections:
      info:
        type: fields
        fields:
          calendar_title:
            label: Page Title
            type: text
          calendar_subtitle:
            label: Subtitle
            type: text
