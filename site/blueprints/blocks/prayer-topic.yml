name: 代禱事項 Prayer Topic
icon: heart
preview: fields
fields:
  heading:
    label: 標題 / Heading
    type: text
    placeholder: 每週代禱事項

  last_updated:
    label: 上次更新 / Last Updated
    type: date
    display: YYYY-MM-DD

  default_open:
    label: 預設展開 / Open by Default
    type: toggle
    default: false
    text:
      - 收起 Collapsed
      - 展開 Open
    help: 短的代禱事項可以預設展開；長的可以預設收起，讓訪客自己點開。

  content:
    label: 內容 / Content
    type: writer
    nodes:
      - heading
      - paragraph
      - bulletList
      - orderedList
    marks:
      - bold
      - italic
      - link
